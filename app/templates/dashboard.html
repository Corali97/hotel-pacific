<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Pacific - Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      body { background: #222; color: #fff; }
      .header-bar { background: #0090d0; color: #000; padding: 1rem 2rem; display: flex; align-items: center; }
      .header-bar h1 { font-size: 1.5rem; margin: 0; font-weight: bold; }
      .header-bar nav { margin-left: auto; }
      .header-bar nav a { color: #000; margin-left: 2rem; text-decoration: none; font-weight: 600; }
      .dashboard { margin: 2rem; }
      .dashboard-row { display: flex; gap: 2rem; justify-content: center; margin-bottom: 2rem; }
      .dashboard-card { background: #222; color: #fff; border-radius: 1rem; padding: 1rem 2rem; min-width: 160px; text-align: center; }
      .dashboard-card img { max-width: 48px; margin: 0.5rem auto; display: block; }
      .dashboard-card .circle {
        width: 64px; height: 64px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; margin: 0.5rem auto;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        position: relative;
      }
      .dashboard-card .circle svg { position: absolute; top: 0; left: 0; }
      .dashboard-card .circle span { position: relative; z-index: 1; color: #222; font-weight: bold; font-size: 1.1rem; }
      .dashboard-income { text-align: center; font-size: 2rem; margin: 2rem 0 1rem; }
      .dashboard-link { color: #b3e6ff; text-decoration: underline; display: block; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div class="header-bar">
      <h1>Hotel Pacific</h1>
      <nav>
        <a href="/buscar">Buscar</a>
        <a href="/reservas">Reservas</a>
      </nav>
    </div>
    <div class="dashboard">
      <div class="dashboard-row">
        <div class="dashboard-card">
          <a href="#" style="color:#fff;text-decoration:underline;">Dashboard</a>
          <div>Gestión de habitaciones</div>
        </div>
        <div class="dashboard-card">
          <a href="#" style="color:#fff;text-decoration:underline;">Dashboard</a>
          <div>Reservas activas</div>
          <img src="https://img.icons8.com/color/96/5-c.png" alt="Reservas activas" />
        </div>
        <div class="dashboard-card">
          <div>Ocupación</div>
          <div class="circle">
            <svg width="64" height="64">
              <circle cx="32" cy="32" r="28" stroke="#19b34a" stroke-width="8" fill="none" stroke-dasharray="176" stroke-dashoffset="44" />
              <circle cx="32" cy="32" r="28" stroke="#d7dde5" stroke-width="8" fill="none" stroke-dasharray="176" stroke-dashoffset="0" />
            </svg>
            <span>75%</span>
          </div>
        </div>
      </div>
      <div class="dashboard-income">
        Ingresos del mes<br>
        <span style="font-size:2.2rem;">$215.000</span>
      </div>
      <a href="/reservas" class="dashboard-link">Mis reservas</a>
    </div>
  </body>
</html>
