<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Pacific - Habitaciones</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <style>
      body { background: #222; color: #fff; }
      .header-bar { background: #0090d0; color: #000; padding: 1rem 2rem; display: flex; align-items: center; }
      .header-bar h1 { font-size: 1.5rem; margin: 0; font-weight: bold; }
      .header-bar nav { margin-left: auto; }
      .header-bar nav a { color: #000; margin-left: 2rem; text-decoration: none; font-weight: 600; }
      .room-list { margin: 2rem 0; }
      .room { display: flex; align-items: center; margin-bottom: 1.5rem; }
      .room img { width: 48px; height: 48px; margin-right: 1rem; border-radius: 0.5rem; background: #fff; }
      .room-info { flex: 1; }
      .room-title { font-size: 1.1rem; font-weight: bold; }
      .room-price { font-size: 1rem; margin-top: 0.2rem; }
      .reserve-btn { background: #19b34a; color: #fff; border: none; padding: 0.7rem 1.2rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; margin-left: 1rem; }
      .reserve-btn:hover { background: #148c39; }
      .compare-link { color: #b3e6ff; text-decoration: underline; margin-top: 1rem; display: inline-block; }
    </style>
  </head>
  <body>
    <div class="header-bar">
      <h1>Hotel Pacific</h1>
      <nav>
        <a href="/buscar">Buscar</a>
        <a href="/reservas">Reservas</a>
      </nav>
    </div>
    <div class="room-list">
      <h2>Listado de habitaciones</h2>
      <table style="width:100%;background:#fff;color:#222;border-radius:1rem;box-shadow:0 8px 24px rgba(0,0,0,0.08);overflow:hidden;">
        <thead>
          <tr style="background:#e0f7fa;">
            <th>Imagen</th>
            <th>Tipo</th>
            <th>Precio</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="text-align:center;"><img src="https://img.icons8.com/ios-filled/50/bed.png" alt="Estándar" /></td>
            <td>Habitación estándar</td>
            <td>$40.000 por día</td>
            <td><a class="reserve-btn" href="/reservar?tipo=estándar">Reservar</a></td>
          </tr>
          <tr>
            <td style="text-align:center;"><img src="https://img.icons8.com/ios-filled/50/bed.png" alt="Deluxe" /></td>
            <td>Habitación deluxe</td>
            <td>$70.000 por día</td>
            <td><a class="reserve-btn" href="/reservar?tipo=deluxe">Reservar</a></td>
          </tr>
          <tr>
            <td style="text-align:center;"><img src="https://img.icons8.com/ios-filled/50/bed.png" alt="Suite" /></td>
            <td>Habitación suite</td>
            <td>$105.000 por día</td>
            <td><a class="reserve-btn" href="/reservar?tipo=suite">Reservar</a></td>
          </tr>
        </tbody>
      </table>
      <a href="#" class="compare-link">Comparar habitaciones</a>
    </div>
  </body>
</html>
